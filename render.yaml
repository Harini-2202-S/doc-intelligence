# Render Blueprint. In the Render dashboard choose New > Blueprint and select this repository.
# Values marked "sync: false" are entered in the dashboard; see DEPLOYMENT.md.
services:
  - type: web
    name: doc-intelligence
    runtime: python
    plan: free
    buildCommand: pip install .
    startCommand: >-
      alembic upgrade head &&
      uvicorn doc_intelligence.main:create_app --factory --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      # Trust X-Forwarded-For from Render's proxy so client IPs in the audit log are correct.
      - key: FORWARDED_ALLOW_IPS
        value: "*"
      - key: DI_ENVIRONMENT
        value: prod
      - key: DI_JWT_SECRET
        generateValue: true
      - key: DI_STORAGE_ENCRYPTION_KEY
        sync: false
      # PostgreSQL (for example Neon). Use the direct, non-pooled connection string.
      - key: DI_DATABASE_URL
        sync: false
      # Qdrant Cloud
      - key: DI_QDRANT_LOCATION
        sync: false
      - key: DI_QDRANT_API_KEY
        sync: false
      # S3-compatible object storage (for example Cloudflare R2)
      - key: DI_STORAGE_BACKEND
        value: s3
      - key: DI_S3_BUCKET
        sync: false
      - key: DI_S3_ENDPOINT_URL
        sync: false
      - key: DI_S3_ACCESS_KEY_ID
        sync: false
      - key: DI_S3_SECRET_ACCESS_KEY
        sync: false
      # OpenAI
      - key: DI_LLM_PROVIDER
        value: openai
      - key: DI_OPENAI_API_KEY
        sync: false
      # Limits for a public demo
      - key: DI_MAX_UPLOAD_MB
        value: "10"
      - key: DI_UPLOADS_PER_HOUR
        value: "15"
      - key: DI_CHAT_MESSAGES_PER_HOUR
        value: "40"
      - key: DI_GLOBAL_UPLOADS_PER_HOUR
        value: "100"
      - key: DI_GLOBAL_CHAT_MESSAGES_PER_HOUR
        value: "400"
